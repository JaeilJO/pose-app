<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1, maximum-scale=1, viewport-fit=cover" />
  <title>Pose prototype</title>
  <link rel="stylesheet" href="/src/style.css" />
</head>
<body>
  <canvas id="scene"></canvas>

  <header class="topbar">
    <div class="brand" data-i18n="title">Pose prototype</div>
    <div class="spacer"></div>
    <button id="timerBtn" class="chip" type="button" aria-label="Timer">
      <svg viewBox="0 0 24 24"><circle cx="12" cy="13" r="8"/><path d="M12 9v4l2.5 2"/><path d="M9 2h6"/></svg>
      <span id="timerText">0:00.0</span>
    </button>
    <span id="fps" class="chip muted">-- fps</span>
    <select id="lang" class="chip" aria-label="Language">
      <option value="en">EN</option>
      <option value="es">ES</option>
      <option value="pt">PT</option>
      <option value="ko">KO</option>
    </select>
  </header>

  <div id="hint" class="hint" hidden>
    <p data-i18n="hint1"></p>
    <p data-i18n="hint2"></p>
    <p data-i18n="hint3"></p>
    <button type="button" id="hintClose" class="primary" data-i18n="gotIt">Got it</button>
  </div>

  <div class="lens">
    <span data-i18n="lens">Lens</span>
    <input id="fov" type="range" min="15" max="90" value="40" aria-label="Lens" />
    <span id="fovText">40°</span>
  </div>

  <div id="bodyPanel" class="panel" hidden>
    <div class="panel-head">
      <div class="seg">
        <button type="button" data-model="male" data-i18n-model="male">Male</button>
        <button type="button" data-model="female" data-i18n-model="female">Female</button>
      </div>
      <button type="button" id="bodyClose" class="icon" aria-label="Close">✕</button>
    </div>
    <label class="slider"><span data-i18n="height">Height</span><input id="shape-height" type="range" min="0" max="100" /><output id="out-height"></output></label>
    <label class="slider"><span data-i18n="fat">Body fat</span><input id="shape-weight" type="range" min="0" max="100" /><output id="out-weight"></output></label>
    <label class="slider"><span data-i18n="muscle">Muscle</span><input id="shape-muscle" type="range" min="0" max="100" /><output id="out-muscle"></output></label>
    <button type="button" id="shapeReset" class="link" data-i18n="resetShape">Reset body</button>
  </div>

  <nav class="toolbar">
    <button type="button" data-act="undo"><svg viewBox="0 0 24 24"><path d="M9 14L4 9l5-5"/><path d="M4 9h10a6 6 0 0 1 0 12h-3"/></svg><span data-i18n="undo">Undo</span></button>
    <button type="button" data-act="redo"><svg viewBox="0 0 24 24"><path d="M15 14l5-5-5-5"/><path d="M20 9H10a6 6 0 0 0 0 12h3"/></svg><span data-i18n="redo">Redo</span></button>
    <button type="button" data-act="body"><svg viewBox="0 0 24 24"><circle cx="12" cy="5" r="2.5"/><path d="M12 8v7"/><path d="M7 10.5l5-2.5 5 2.5"/><path d="M9 22l3-7 3 7"/></svg><span data-i18n="body">Body</span><em id="modelName">Male</em></button>
    <button type="button" data-act="reset"><svg viewBox="0 0 24 24"><path d="M3 12a9 9 0 1 0 3-6.7"/><path d="M3 4v5h5"/></svg><span data-i18n="reset">Reset</span></button>
    <button type="button" data-act="view"><svg viewBox="0 0 24 24"><path d="M2 12s4-7 10-7 10 7 10 7-4 7-10 7S2 12 2 12z"/><circle cx="12" cy="12" r="3"/></svg><span data-i18n="view">View</span><em id="viewName">3/4</em></button>
    <button type="button" data-act="pins" class="on"><svg viewBox="0 0 24 24"><path d="M12 22s7-6.5 7-12a7 7 0 0 0-14 0c0 5.5 7 12 7 12z"/><circle cx="12" cy="10" r="2.5"/></svg><span data-i18n="pins">Dots</span></button>
    <button type="button" data-act="skirt"><svg viewBox="0 0 24 24"><path d="M8 3h8l1 5H7z"/><path d="M7 8L3 21h18L17 8"/></svg><span data-i18n="skirt">Skirt</span></button>
    <button type="button" data-act="snap"><svg viewBox="0 0 24 24"><path d="M4 7h3l2-3h6l2 3h3v13H4z"/><circle cx="12" cy="13" r="4"/></svg><span data-i18n="snap">Snapshot</span></button>
  </nav>

  <div id="snapOverlay" class="overlay" hidden>
    <div class="card">
      <img id="snapImg" alt="Pose snapshot" />
      <p data-i18n="saveHint"></p>
      <button type="button" id="snapClose" class="primary" data-i18n="close">Close</button>
    </div>
  </div>

  <script type="module" src="/src/main.js"></script>
</body>
</html>
